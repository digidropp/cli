# Publishes a release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# Builds standalone binaries for every platform and attaches them, with checksums, to the GitHub release.
# install.sh and install.ps1 download from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the version in package.json and src/index.js
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          grep -q "const VERSION = \"${GITHUB_REF_NAME#v}\";" src/index.js
      - run: sh scripts/build.sh
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
